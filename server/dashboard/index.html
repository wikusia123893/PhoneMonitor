<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Phone Monitor Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #090212; 
            --accent-glow: rgba(168, 85, 247, 0.5); 
            --card-glass: rgba(255, 255, 255, 0.05);
            --accent: #a855f7;
            --pink: #ec4899;
            --cyan: #03dac6;
        }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; background-color: var(--bg-dark); color: #fff; 
            font-family: 'Poppins', sans-serif; min-height: 100vh;
            padding-top: 80px; overflow-x: hidden; position: relative;
        }

        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #180533 0%, #090212 100%);
        }

        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(168, 85, 247, 0.07) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(168, 85, 247, 0.07) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.65; z-index: -2; animation: floatOrb 20s infinite alternate ease-in-out; }
        .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -10%; left: -10%; animation-duration: 25s; }
        .orb-2 { width: 600px; height: 600px; background: var(--pink); bottom: -20%; right: -10%; animation-duration: 30s; animation-delay: -5s; }
        .orb-3 { width: 450px; height: 450px; background: var(--cyan); top: 40%; left: 50%; animation-duration: 22s; animation-delay: -10s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30vw, 20vh) scale(1.2); }
            66% { transform: translate(-20vw, 40vh) scale(0.8); }
            100% { transform: translate(10vw, -10vh) scale(1.1); }
        }

        header { padding: 20px; text-align: center; position: relative; z-index: 10; }
        h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: 3px; color: #fff; margin: 0; text-shadow: 0 0 25px var(--accent-glow), 0 0 50px rgba(236, 72, 153, 0.4); }
        
        #phones { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 35px; padding: 40px; max-width: 1300px; margin: 0 auto; position: relative; z-index: 10;
        }

        @keyframes cardAppear { 0% { opacity: 0; transform: translateY(40px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        
        .card { 
            background: var(--card-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 35px; border-radius: 40px;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: cardAppear 0.6s ease-out forwards;
        }

        .card:hover { transform: scale(1.02); border-color: rgba(168, 85, 247, 0.8); }
        h2 { margin: 0 0 20px 0; font-size: 1.5rem; color: #fff; display: flex; justify-content: space-between; }
        
        .status-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .status-badge { 
            padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
            display: flex; align-items: center; gap: 6px; text-transform: uppercase;
            transition: background 0.3s ease;
        }
        
        .on { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .off { background: rgba(255, 255, 255, 0.08); color: #aaa; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        button { 
            padding: 14px; border: none; border-radius: 18px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
            background: rgba(255,255,255,0.08); color: white; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        button:hover:not(:disabled) { background: var(--accent); transform: translateY(-2px); }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
        .btn-ip { grid-column: span 2; background: linear-gradient(135deg, #03dac6, #00b3a6); color: #000; font-weight: 700; }

        input { 
            width: 100%; padding: 14px 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15); 
            margin-top: 18px; background: rgba(0,0,0,0.4); color: white;
        }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        .modal-content { background: #180a29; margin: 8% auto; padding: 40px; border-radius: 40px; width: 90%; max-width: 450px; border: 1px solid var(--accent); }
        
        .ticker-wrap { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 12px 0; z-index: 100; border-bottom: 1px solid var(--pink); }
        .ticker { white-space: nowrap; animation: ticker 25s linear infinite; font-size: 0.85rem; color: var(--pink); }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div class="bg-animation"><div class="cyber-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div class="ticker-wrap"><div class="ticker">❤️ • NAPISZ COŚ MIŁEGO SWOJEJ DZIEWCZYNIE • ❤️ • NAPISZ COŚ MIŁEGO SWOJEJ DZIEWCZYNIE • ❤️</div></div>

<header><h1>PHONE MONITOR PRO</h1></header>
<div id="phones"></div>

<div id="historyModal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer;" onclick="closeModal()">✕</span>
        <h2>📜 Historia</h2>
        <div id="historyContent"></div>
    </div>
</div>

<script>
    async function loadPhones() {
        try {
            let response = await fetch("/phones/");
            let phones = await response.json();
            const container = document.getElementById("phones");

            for (const phone of phones) {
                let cardId = `card_${phone.device_id}`;
                let card = document.getElementById(cardId);

                if (!card) {
                    // TWORZENIE NOWEJ KARTY
                    card = document.createElement('div');
                    card.className = 'card';
                    card.id = cardId;
                    card.innerHTML = `
                        <h2><span>📱 ${phone.name}</span></h2>
                        <div class="status-grid">
                            <span class="status-badge"></span>
                            <span class="status-badge"></span>
                            <span class="status-badge"></span>
                        </div>
                        <div style="font-size: 0.95rem; opacity: 0.9; margin-bottom: 20px; line-height: 1.8; background: rgba(0,0,0,0.25); padding: 15px 20px; border-radius: 20px;">
                            <div>🔋 Bateria: <b class="battery-val"></b></div>
                            <div>🌡️ Temperatura: <b class="temp-val"></b></div>
                            <div>🌐 IP: <b class="ip-val"></b></div>
                        </div>
                        <div class="btn-grid">
                            <button class="btn-action" onclick="send(this, '${phone.device_id}','START_TAILSCALE')">⚡ Tailscale</button>
                            <button class="btn-action" onclick="send(this, '${phone.device_id}','START_PROXY')">🛡️ Proxy</button>
                            <button class="btn-ip btn-action" onclick="send(this, '${phone.device_id}','CHANGE_IP')">🚀 Zmień IP</button>
                            <button class="btn-action" onclick="send(this, '${phone.device_id}','REBOOT')">🔄 Restart</button>
                            <button style="background: rgba(168, 85, 247, 0.25);" onclick="showHistory('${phone.device_id}', '${phone.name}')">📊 Historia</button>
                        </div>
                        <input id="cmd_${phone.device_id}" placeholder="💻 Komenda shell...">
                        <button class="btn-action" style="width:100%; margin-top:15px; background: linear-gradient(135deg, #a855f7, #7e22ce);" onclick="sendShell(this, '${phone.device_id}')">WYŚLIJ KOMENDĘ</button>
                    `;
                    container.appendChild(card);
                }

                // AKTUALIZACJA DANYCH BEZ MIGANIA (Dla istniejących i nowych kart)
                const badgeAgent = card.querySelector('.status-grid span:nth-child(1)');
                badgeAgent.className = `status-badge ${phone.online ? 'on' : 'off'}`;
                badgeAgent.innerText = `Agent ${phone.online ? 'ON' : 'OFF'}`;
                
                const badgeTs = card.querySelector('.status-grid span:nth-child(2)');
                badgeTs.className = `status-badge ${phone.tailscale ? 'on' : 'off'}`;
                badgeTs.innerText = `TS ${phone.tailscale ? 'ON' : 'OFF'}`;

                const badgePx = card.querySelector('.status-grid span:nth-child(3)');
                badgePx.className = `status-badge ${phone.every_proxy ? 'on' : 'off'}`;
                badgePx.innerText = `PX ${phone.every_proxy ? 'ON' : 'OFF'}`;

                const batteryEl = card.querySelector('.battery-val');
                const tempEl = card.querySelector('.temp-val');
                const ipEl = card.querySelector('.ip-val');
                const actionBtns = card.querySelectorAll('.btn-action');

                // KIEDY AGENT SIĘ ROZŁĄCZYŁ (OFFLINE)
                if (!phone.online) {
                    card.style.opacity = "0.5";
                    card.style.borderColor = "#ef4444"; // Czerwone ostrzeżenie na ramce
                    
                    batteryEl.innerText = "OFFLINE";
                    batteryEl.style.color = "#ef4444";
                    
                    tempEl.innerText = "---";
                    
                    ipEl.innerText = "Brak połączenia (Rozłączony)";
                    ipEl.style.color = "#ef4444";
                    
                    // Blokujemy przyciski sterowania, żeby nie wysyłać w próżnię (Historia wciąż działa)
                    actionBtns.forEach(b => b.disabled = true);
                } 
                // KIEDY AGENT JEST AKTYWNY (ONLINE)
                else {
                    card.style.opacity = "1";
                    card.style.borderColor = "rgba(255, 255, 255, 0.15)";
                    
                    batteryEl.innerText = `${phone.battery || 0}%`;
                    batteryEl.style.color = (phone.battery < 20) ? '#ef4444' : '#4ade80';
                    
                    tempEl.innerText = phone.battery_temp ? phone.battery_temp + '°C' : '---';
                    
                    ipEl.innerText = phone.ip || "-";
                    ipEl.style.color = "var(--cyan)";
                    
                    actionBtns.forEach(b => b.disabled = false);
                }
            }
        } catch(e) { console.error("Błąd aktualizacji:", e); }
    }

    async function send(btn, device, command){ 
        const oldText = btn.innerText;
        btn.innerText = "⏳..."; btn.disabled = true;
        try { 
            await fetch("/commands/add",{ 
                method:"POST", 
                headers:{"Content-Type":"application/json"}, 
                body:JSON.stringify({ device_id:device, command:command, payload:"" }) 
            }); 
        } catch(e) { console.error(e); }
        setTimeout(() => { 
            btn.innerText = "✅"; 
            setTimeout(() => { btn.innerText = oldText; btn.disabled = false; loadPhones(); }, 1000); 
        }, 500);
    }

    async function sendShell(btn, device){ 
        const inputEl = document.getElementById("cmd_" + device);
        const payload = inputEl.value;
        const oldText = btn.innerText;
        btn.innerText = "🚀..."; btn.disabled = true;
        try { 
            await fetch("/commands/add",{ 
                method:"POST", 
                headers:{"Content-Type":"application/json"}, 
                body:JSON.stringify({ device_id:device, command:"SHELL", payload:payload }) 
            }); 
            inputEl.value = ""; 
        } catch(e) { console.error(e); }
        setTimeout(() => { 
            btn.innerText = "✅"; 
            setTimeout(() => { btn.innerText = oldText; btn.disabled = false; loadPhones(); }, 1000); 
        }, 500);
    }

    async function showHistory(deviceId, phoneName) { 
        document.getElementById("historyModal").style.display = "block";
        try {
            let res = await fetch("/phones/" + deviceId + "/history"); 
            let data = await res.json();
            document.getElementById("historyContent").innerHTML = `Proxy: ${data.proxy ? data.proxy.length : 0} | Tailscale: ${data.tailscale ? data.tailscale.length : 0}`;
        } catch(e) {
            document.getElementById("historyContent").innerHTML = "Brak danych historii.";
        }
    }
    
    function closeModal() { document.getElementById("historyModal").style.display = "none"; }
    
    loadPhones();
    setInterval(loadPhones, 2000);
</script>
</body>
</html>
